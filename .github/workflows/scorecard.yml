# OpenSSF Scorecard: scores this repository's supply-chain practices (pinned actions, token permissions, branch
# protection, ...), publishes the result to the OpenSSF Scorecard API (https://scorecard.dev) and uploads it to code
# scanning (https://github.com/ossf/scorecard-action).
#
# Runs only while the repository is public: publish_results and the Scorecard API cover public repositories, and
# private ones need GitHub Advanced Security. toJSON(...) == 'false' rather than `private == false`, because GitHub
# expressions coerce a missing value (null) to 0, which equals false, so the shorter form would run the job when
# the field is absent (https://docs.github.com/en/actions/reference/workflows-and-actions/expressions).
#
# publish_results: true imposes rules on this file: no top-level env or defaults, no workflow-level write
# permissions, id-token: write only in the Scorecard job, and only approved actions in that job.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 6"

permissions:
  contents: read

jobs:
  analysis:
    if: toJSON(github.event.repository.private) == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the repository
      security-events: write # upload the results to code scanning
      id-token: write # publish_results: Scorecard's API authenticates this workflow with its OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
          category: scorecard
