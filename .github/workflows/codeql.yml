# CodeQL: static analysis of the TypeScript/JavaScript code and of these GitHub Actions workflows.
#
# Runs only while the repository is public: code scanning on a private repository needs GitHub Code Security.
# toJSON(...) == 'false' rather than `private == false`, because GitHub expressions coerce a missing value (null)
# to 0, which equals false (https://docs.github.com/en/actions/reference/workflows-and-actions/expressions).
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so new CodeQL queries are run against unchanged code too.
    - cron: "23 5 * * 2"

permissions:
  contents: read

concurrency:
  # One group per pull request (a newer push cancels the older run); every other run has its own group, so main
  # commits never queue behind or cancel each other. Why: the concurrency comment in ci.yml.
  group: codeql-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    if: toJSON(github.event.repository.private) == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # check out the repository
      security-events: write # upload the analysis to code scanning
    strategy:
      fail-fast: false
      matrix:
        # build-mode none: CodeQL reads the source directly; nothing from the repository is built or installed.
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
