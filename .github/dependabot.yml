# Dependabot version updates: weekly, grouped into one pull request per ecosystem, and never for a release younger
# than the cooldown. The npm cooldown (default-days 7, semver-major-days 14) is at least as long as the 7-day soak
# that wormsign soak enforces by default on every pull request (wormsign.yml). Dependabot ran npm with
# --min-release-age=7, its default-days, for major updates too, whose cooldown is 14 (observed in its first run,
# 2026-10-03). So every version its pull requests lock, transitive ones included, is at least 7
# days old when the pull request is opened and passes that gate, and a compromised release that is caught and
# unpublished in its first days is never proposed at all.
#
# Keys verified against https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference:
# cooldown applies to version updates only, not security updates (which should not wait for the cooldown; the
# wormsign gate still fails one younger than 7 days until a time-limited baseline entry is on main,
# docs/soak.md#emergency-exceptions); npm supports per-semver
# cooldowns, github-actions supports default-days only. directory "/" for github-actions covers .github/workflows
# and the root action.yml.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    # Every dependency is a dev dependency (wormsign has no npm runtime dependencies; the TOML parser vendored in
    # src/vendor/ is not an npm dependency, so Dependabot does not see it: upgrading it is a manual step through
    # scripts/verify-vendor.mjs --write, and a CI job re-derives the copy on every change and monthly). Minor and patch
    # updates share one pull request; a major update gets its own.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    # @types/node stays on the major of the oldest Node that package.json "engines" supports (22): newer type
    # definitions would let the code use APIs that Node 22 does not have, and the type check would not notice.
    # Minor and patch updates still come in the group above. Raise this with "engines".
    #
    # typescript stays inside the range typescript-eslint declares as a peer dependency, ">=4.8.4 <6.1.0" in 8.71.1
    # (the latest on 2026-10-05). typescript 7 is outside it, so npm ci fails with ERESOLVE before anything runs, as
    # it did on Dependabot's typescript 7 pull request in the private pre-release development repository. Widen or
    # remove this when typescript-eslint's peer range moves.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        versions: [">=6.1.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
