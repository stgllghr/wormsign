id: WS-CI-005
title: Whole secrets context serialized inside a workflow run
severity: high
description: >-
  Every wave's injected workflow puts ${{ toJSON(secrets) }} into an environment variable and sends
  it out: to webhook.site (2025-09, StepSecurity), or as a workflow artifact (2025-11 "Code Formatter",
  Wiz; 2026-08 "Run Copilot", JFrog). GitHub documents the serialized secrets context as JSON with the
  key "github_token" and values masked as "***". GitHub also prints each step's env block in the job
  log with secrets masked, so a run carrying the serialized context leaves a "github_token": "***"
  line. That header echo is also the only place the worm's runs show it: the 2025-11 and 2026-08
  workflows write the variable to a file and upload it, and the 2025-09 one prints it only base64
  encoded. So the rule cannot leave the header out, and it cannot tell the worm from a legitimate step
  that takes toJSON(secrets): an action that receives it as an input (with:) prints the same line in its
  header on every run. The pattern is one line, so it cannot also require the exfiltration step; the
  logic below does that at the job level. Severity is high, not critical, for that reason. The 2026-08
  wave deletes the run afterwards (JFrog), which deletes its log; Wiz reports the 2025-11 wave deleting
  "the workflow", which may also mean the run. So this rule only works on logs exported as they are
  written.
attack:
  - id: T1677
    name: Poisoned Pipeline Execution
    url: https://attack.mitre.org/techniques/T1677/
  - id: T1528
    name: Steal Application Access Token
    url: https://attack.mitre.org/techniques/T1528/
data_source: >-
  GitHub Actions job logs, collected as they are written (for example by a log-forwarding step or a
  self-hosted runner's log shipper) so they survive deletion of the run.
pattern: '"github_token": ?"\*\*\*"'
logic: |
  Match pattern against each job log line. On a hit, fetch the workflow file at the run's head_sha;
  wormsign scan reports it as WS-GH-002 (toJSON(secrets)). Treat it as critical, and rotate every secret
  the repository and organization expose to Actions, when the same job also writes that variable to a
  file a later step uploads as an artifact, sends it with curl, or runs from a workflow that is new or on
  a branch of data/iocs/repos.json (WS-AL-004). When the line comes from the with: block of a reviewed
  action that takes toJSON(secrets), suppress by repository, workflow path and action.
false_positives:
  - Every run of a step that takes toJSON(secrets) as an action input or an env value, such as actions that export all secrets as environment variables. GitHub prints the input in the step header, so the line is the same as the worm's.
  - Debug steps that print the secrets context on purpose. That is unsafe practice and worth fixing anyway.
sources:
  - https://www.stepsecurity.io/blog/ctrl-tinycolor-and-40-npm-packages-compromised
  - https://www.wiz.io/blog/shai-hulud-2-0-ongoing-supply-chain-attack
  - https://research.jfrog.com/post/shai-hulud-is-back-august/
  - https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#example-contents-of-the-secrets-context
examples:
  positive: |
    2026-09-29T02:53:00.0000000Z     "github_token": "***",
    {"github_token":"***","NPM_TOKEN":"***"}
  negative: |
    2026-09-29T02:52:37.8814198Z   token: ***
    2026-09-29T02:52:37.8814808Z   GITHUB_TOKEN: ***
    2026-09-29T02:52:37.8815002Z   "NPM_TOKEN": "***",
  # Lines the pattern matches that are not the worm, pinned so the false-positive note cannot go stale. Synthetic:
  # the header of a step taking toJSON(secrets) as an action input; its exact indentation was not observed.
  known_false_positive: |
    2026-09-29T02:52:38.1022910Z   "github_token": "***",
