# WS-AL-004 as three Sigma rules: a new workflow's first run deleted with a token within the hour (critical, a
# correlation over two base rules); a run on a worm branch (critical); and a job started on a worm branch (critical).
# Fields are GitHub's audit-log event fields. An earlier rule for runs started by a bot, which gave the file its old
# name, was removed: the worm pushes with the victim's own token, so it runs as a human actor.
title: Job started on a Shai-Hulud worm branch
id: 9d226234-b0d1-43ac-a8de-11e460159a8c
name: ws_al_004_worm_branch_job
status: experimental
description: >-
  Each wave pushes a workflow that serializes every secret, ${{ toJSON(secrets) }}, on a branch of its own:
  shai-hulud-workflow.yml on shai-hulud (2025-09), formatter_123456789.yml on add-linter-workflow-<ms>
  (2025-11), and codeql_analysis.yml ("Run Copilot") on dependabot/github_actions/format/setup-formatter,
  committed as github-advanced-security[bot] (2026-08). It pushes with the victim's stolen token, so the
  run's actor is the victim, a human: an earlier version of this rule, which watched for first runs started
  by a bot, missed the worm and fired once per repository on Dependabot's own first run. This rule watches
  workflows.prepared_workflow_job, which GitHub describes as a job that started and lists the secrets
  provided to it in secrets_passed: the list of secrets to rotate. secrets_passed is for the responder, not a
  condition. It is a JSON array, which Splunk's JSON extraction may name secrets_passed{} (the spath path
  of an array's values), so a test of secrets_passed could never match there; and a worm job in a
  repository without secrets is still the worm. GitHub lists job_workflow_ref without defining its value,
  so the rule matches the branch after the @ in two forms: refs/heads/<branch>, as in the Actions OIDC
  claim of that name (owner/repo/path@ref), and the bare branch. Neither was checked against a real event,
  so this rule's recall is unverified: a value in another form, such as a commit SHA after the @, never
  matches, and nothing says so. ws_al_004_worm_branch_run reads the documented head_branch of the same
  runs. The branches are those of data/iocs/repos.json; the test fails if one is missing here, in either
  form. wormsign id WS-AL-004.
references:
  - https://www.stepsecurity.io/blog/ctrl-tinycolor-and-40-npm-packages-compromised
  - https://www.wiz.io/blog/shai-hulud-2-0-ongoing-supply-chain-attack
  - https://research.jfrog.com/post/shai-hulud-is-back-august/
  - https://attack.mitre.org/software/S9008/
  # GitHub audit-log event schema (workflows.prepared_workflow_job: job_workflow_ref, secrets_passed), retrieved 2026-10-15.
  - https://docs.github.com/en/enterprise-cloud@latest/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/audit-log-events-for-your-organization#workflows
  # Splunk spath: a location path names the values of an array with {} (commits{}.id), retrieved 2026-10-15.
  - https://help.splunk.com/en/splunk-enterprise/search/spl-search-reference/10.6/search-commands/spath
author: wormsign
date: 2026-10-15
tags:
  - attack.execution
  - attack.t1677
  - attack.credential-access
  - attack.t1528
logsource:
  product: github
  service: audit
  definition: >-
    Requirements: GitHub Enterprise Cloud, with the audit log streamed to the SIEM or polled from
    GET /orgs/{org}/audit-log; workflows.prepared_workflow_job is not shown in the web UI.
detection:
  selection:
    action: workflows.prepared_workflow_job
  worm_ref_exact:
    job_workflow_ref|endswith:
      - '@refs/heads/shai-hulud'
      - '@shai-hulud'
      - '@refs/heads/dependabot/github_actions/format/setup-formatter'
      - '@dependabot/github_actions/format/setup-formatter'
  worm_ref_prefix:
    job_workflow_ref|contains:
      - '@refs/heads/add-linter-workflow-'
      - '@add-linter-workflow-'
  condition: selection and 1 of worm_ref_*
falsepositives:
  - A branch given one of these names on purpose, for example to test this rule or to replay the worm.
level: critical
# Not part of the Sigma standard; pySigma keeps unknown keys as custom attributes. Synthetic events:
# @timestamp in epoch milliseconds is illustrative, since GitHub does not document its format, and so are the
# values of job_workflow_ref and secrets_passed.
examples:
  positive: |
    {"action":"workflows.prepared_workflow_job","actor":"victim-dev","@timestamp":1790900030000,"repo":"example-org/api","workflow_run_id":555,"job_name":"format","job_workflow_ref":"example-org/api/.github/workflows/codeql_analysis.yml@refs/heads/dependabot/github_actions/format/setup-formatter","runner_name":"GitHub Actions 7","is_hosted_runner":true,"secrets_passed":["NPM_TOKEN","AWS_SECRET_ACCESS_KEY"]}
    {"action":"workflows.prepared_workflow_job","actor":"victim-dev","@timestamp":1790900030000,"repo":"example-org/web","workflow_run_id":556,"job_name":"lint","job_workflow_ref":"example-org/web/.github/workflows/formatter_123456789.yml@refs/heads/add-linter-workflow-1764000000000","runner_name":"GitHub Actions 8","is_hosted_runner":true,"secrets_passed":["NPM_TOKEN"]}
    {"action":"workflows.prepared_workflow_job","actor":"victim-dev","@timestamp":1790800030000,"repo":"example-org/lib","workflow_run_id":554,"job_name":"process","job_workflow_ref":"example-org/lib/.github/workflows/shai-hulud-workflow.yml@refs/heads/shai-hulud","runner_name":"GitHub Actions 9","is_hosted_runner":true,"secrets_passed":["NPM_TOKEN"]}
    {"action":"workflows.prepared_workflow_job","actor":"victim-dev","@timestamp":1790800030000,"repo":"example-org/new-lib","workflow_run_id":553,"job_name":"process","job_workflow_ref":"example-org/new-lib/.github/workflows/shai-hulud-workflow.yml@refs/heads/shai-hulud","runner_name":"GitHub Actions 13","is_hosted_runner":true}
    {"action":"workflows.prepared_workflow_job","actor":"victim-dev","@timestamp":1790900030000,"repo":"example-org/cli","workflow_run_id":558,"job_name":"lint","job_workflow_ref":"example-org/cli/.github/workflows/formatter_123456789.yml@add-linter-workflow-1764000000000","runner_name":"GitHub Actions 14","is_hosted_runner":true,"secrets_passed":["NPM_TOKEN"]}
    {"action":"workflows.prepared_workflow_job","actor":"victim-dev","@timestamp":1790900030000,"repo":"example-org/sdk","workflow_run_id":559,"job_name":"format","job_workflow_ref":"example-org/sdk/.github/workflows/codeql_analysis.yml@dependabot/github_actions/format/setup-formatter","runner_name":"GitHub Actions 15","is_hosted_runner":true,"secrets_passed":["NPM_TOKEN"]}
  negative: |
    {"action":"workflows.prepared_workflow_job","actor":"dev","@timestamp":1790900030000,"repo":"example-org/api","workflow_run_id":557,"job_name":"test","job_workflow_ref":"example-org/api/.github/workflows/ci.yml@refs/heads/main","runner_name":"GitHub Actions 10","is_hosted_runner":true,"secrets_passed":["NPM_TOKEN"]}
    {"action":"workflows.prepared_workflow_job","actor":"dev","@timestamp":1790900030000,"repo":"example-org/api","workflow_run_id":560,"job_name":"lint","job_workflow_ref":"example-org/api/.github/workflows/lint.yml@refs/heads/feature/add-linter-workflow-1","runner_name":"GitHub Actions 11","is_hosted_runner":true,"secrets_passed":["NPM_TOKEN"]}
    {"action":"workflows.prepared_workflow_job","actor":"dev","@timestamp":1790900030000,"repo":"example-org/docs","workflow_run_id":561,"job_name":"build","job_workflow_ref":"example-org/docs/.github/workflows/docs.yml@refs/heads/shai-hulud-notes","runner_name":"GitHub Actions 12","is_hosted_runner":true,"secrets_passed":["DOCS_TOKEN"]}
    {"action":"workflows.prepared_workflow_job","actor":"dev","@timestamp":1790900030000,"repo":"example-org/api","workflow_run_id":563,"job_name":"lint","job_workflow_ref":"example-org/api/.github/workflows/lint.yml@feature/add-linter-workflow-1","runner_name":"GitHub Actions 16","is_hosted_runner":true,"secrets_passed":["NPM_TOKEN"]}
    {"action":"workflows.prepared_workflow_job","actor":"dev","@timestamp":1790900030000,"repo":"example-org/docs","workflow_run_id":564,"job_name":"build","job_workflow_ref":"example-org/docs/.github/workflows/docs.yml@shai-hulud-notes","runner_name":"GitHub Actions 17","is_hosted_runner":true,"secrets_passed":["DOCS_TOKEN"]}
