title: Workflow run on a Shai-Hulud worm branch
id: f9bf1836-2261-4272-a30a-935dbf3e9790
name: ws_al_004_worm_branch_run
status: experimental
description: >-
  A workflow run on a branch name one of the waves uses: shai-hulud (2025-09),
  add-linter-workflow-<ms> (2025-11) or dependabot/github_actions/format/setup-formatter (2026-08).
  The values are the branches of data/iocs/repos.json; the test fails if one is missing here. The
  2025-11 and 2026-08 payloads delete the branch after the run, so the audit log may be the only
  place it is still visible. wormsign id WS-AL-004.
references:
  - https://www.stepsecurity.io/blog/ctrl-tinycolor-and-40-npm-packages-compromised
  - https://www.wiz.io/blog/shai-hulud-2-0-ongoing-supply-chain-attack
  - https://research.jfrog.com/post/shai-hulud-is-back-august/
  # GitHub audit-log event schema (workflows events and their fields), retrieved 2026-10-14.
  - https://docs.github.com/en/enterprise-cloud@latest/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/audit-log-events-for-your-organization#workflows
author: wormsign
date: 2026-10-14
tags:
  - attack.execution
  - attack.t1677
logsource:
  product: github
  service: audit
  definition: >-
    Requirements: GitHub Enterprise Cloud, with the audit log streamed to the SIEM or polled from
    GET /orgs/{org}/audit-log; workflows.created_workflow_run is not shown in the web UI.
detection:
  selection:
    action: workflows.created_workflow_run
  worm_branch_exact:
    head_branch:
      - shai-hulud
      - dependabot/github_actions/format/setup-formatter
  worm_branch_prefix:
    head_branch|startswith: add-linter-workflow-
  condition: selection and 1 of worm_branch_*
falsepositives:
  - A branch given one of these names on purpose, for example to test this rule.
level: critical
examples:
  positive: |
    {"action":"workflows.created_workflow_run","actor":"victim-dev","@timestamp":1790800000000,"repo":"example-org/lib","workflow_id":8001,"workflow_run_id":554,"run_number":1,"name":".github/workflows/shai-hulud-workflow.yml","head_branch":"shai-hulud","event":"push","actor_is_bot":false}
    {"action":"workflows.created_workflow_run","actor":"victim-dev","@timestamp":1790900000000,"repo":"example-org/api","workflow_id":9001,"workflow_run_id":555,"run_number":1,"name":"Run Copilot","head_branch":"dependabot/github_actions/format/setup-formatter","event":"push","actor_is_bot":false}
    {"action":"workflows.created_workflow_run","actor":"template-sync[bot]","@timestamp":1790900000000,"repo":"example-org/web","workflow_id":9002,"workflow_run_id":556,"run_number":1,"name":"Code Formatter","head_branch":"add-linter-workflow-1764000000000","event":"push","actor_is_bot":true}
  negative: |
    {"action":"workflows.created_workflow_run","actor":"dev","@timestamp":1790900000000,"repo":"example-org/api","workflow_id":12,"workflow_run_id":557,"run_number":1,"name":"CI","head_branch":"main","event":"push","actor_is_bot":false}
    {"action":"workflows.created_workflow_run","actor":"dev","@timestamp":1790900000000,"repo":"example-org/api","workflow_id":12,"workflow_run_id":560,"run_number":2,"name":"CI","head_branch":"feature/add-linter-workflow-1","event":"push","actor_is_bot":false}
    {"action":"workflows.delete_workflow_run","actor":"victim-dev","@timestamp":1790900400000,"repo":"example-org/lib","workflow_id":8001,"workflow_run_id":554,"run_number":1,"head_branch":"shai-hulud","programmatic_access_type":"OAuth access token"}
