title: New workflow's run deleted with a token within the hour
id: a2e06dd7-a39e-473d-bde8-e26748c25154
name: ws_al_004_new_workflow_run_deleted_by_token
status: experimental
description: >-
  A workflow runs for the first time and, within the hour, that first run is deleted with a token: the
  2026-08 wave deletes its workflow run and its branch afterwards (JFrog), which also deletes the run's
  log. For 2025-11, Wiz reports that it deletes "the workflow" and the branch, which does not say whether
  the run is deleted, so this may not fire for that wave. The audit log has no event that names an added
  file: git.push carries no paths, and GitHub leaves Git events made through the REST or GraphQL APIs (how
  the worm writes files) out of exports and REST results. So the first run stands for the new workflow:
  run_number is 1 only on a workflow's first run (GitHub's Actions contexts reference), assumed to be the
  same number the audit log reports. delete_workflow_run carries run_number, workflow_id and started_at
  itself, but a single-event rule cannot replace this correlation: Sigma cannot compare two fields, so it
  could not require the deletion to come within the hour of the run, and a retention script that deletes
  old runs with a token would fire once for every workflow's first run. Deleted with a token means
  programmatic_access_type is set, which assumes GitHub leaves the field out for web-UI deletions; GitHub
  does not document that. If the worm's workflow file has the path of an existing workflow, its run is
  not a first run and this does not fire. For each alert, fetch the workflow file at head_sha: `wormsign
  scan` flags toJSON(secrets) and IOC workflow names in it. wormsign id WS-AL-004.
references:
  - https://research.jfrog.com/post/shai-hulud-is-back-august/
  - https://www.wiz.io/blog/shai-hulud-2-0-ongoing-supply-chain-attack
  - https://attack.mitre.org/software/S9008/
  # GitHub audit-log event schema (workflows events and their fields; delete_workflow_run's run_number,
  # workflow_id and started_at), retrieved 2026-10-14 and 2026-10-15.
  - https://docs.github.com/en/enterprise-cloud@latest/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/audit-log-events-for-your-organization#workflows
  - https://docs.github.com/en/enterprise-cloud@latest/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/reviewing-the-audit-log-for-your-organization
  # github.run_number: "begins at 1 for the workflow's first run", retrieved 2026-10-14.
  - https://docs.github.com/en/actions/reference/workflows-and-actions/contexts
author: wormsign
date: 2026-10-14
modified: 2026-10-15
tags:
  - attack.execution
  - attack.t1677
correlation:
  # temporal, not temporal_ordered: no run of a workflow can be deleted before its first run exists, and the
  # Splunk and ES|QL backends convert only temporal.
  type: temporal
  rules:
    - ws_al_004_new_workflow_first_run
    - ws_al_004_workflow_run_deleted_by_token
  group-by:
    - repo
    - workflow_id
  timespan: 1h
falsepositives:
  - Release automation that deletes its own runs with a token. Only a deletion of a workflow's first run within the hour after it fires, which keeps this rare.
level: critical
examples:
  positive: |
    {"action":"workflows.created_workflow_run","actor":"victim-dev","@timestamp":1790900000000,"repo":"example-org/api","workflow_id":9001,"workflow_run_id":555,"run_number":1,"name":"Run Copilot","head_branch":"dependabot/github_actions/format/setup-formatter","event":"push","actor_is_bot":false}
    {"action":"workflows.delete_workflow_run","actor":"victim-dev","@timestamp":1790900400000,"repo":"example-org/api","workflow_id":9001,"workflow_run_id":555,"run_number":1,"programmatic_access_type":"OAuth access token"}
  negative: |
    {"action":"workflows.created_workflow_run","actor":"dev","@timestamp":1790900000000,"repo":"example-org/a","workflow_id":21,"workflow_run_id":601,"run_number":1,"name":"CI","head_branch":"main","event":"push","actor_is_bot":false}
    {"action":"workflows.delete_workflow_run","actor":"dev","@timestamp":1790907300000,"repo":"example-org/a","workflow_id":21,"workflow_run_id":601,"run_number":1,"programmatic_access_type":"OAuth access token"}
    {"action":"workflows.created_workflow_run","actor":"dev","@timestamp":1790900000000,"repo":"example-org/b","workflow_id":22,"workflow_run_id":602,"run_number":1,"name":"CI","head_branch":"main","event":"push","actor_is_bot":false}
    {"action":"workflows.delete_workflow_run","actor":"dev","@timestamp":1790900300000,"repo":"example-org/b","workflow_id":22,"workflow_run_id":602,"run_number":1}
    {"action":"workflows.created_workflow_run","actor":"dev","@timestamp":1790900000000,"repo":"example-org/c","workflow_id":23,"workflow_run_id":603,"run_number":40,"name":"Release","head_branch":"main","event":"push","actor_is_bot":false}
    {"action":"workflows.delete_workflow_run","actor":"release-bot","@timestamp":1790900060000,"repo":"example-org/c","workflow_id":23,"workflow_run_id":603,"run_number":40,"programmatic_access_type":"GitHub App server-to-server token"}
    {"action":"workflows.created_workflow_run","actor":"dev","@timestamp":1790900000000,"repo":"example-org/e","workflow_id":25,"workflow_run_id":606,"run_number":1,"name":"CI","head_branch":"main","event":"push","actor_is_bot":false}
    {"action":"workflows.delete_workflow_run","actor":"dev","@timestamp":1790900060000,"repo":"example-org/e","workflow_id":26,"workflow_run_id":607,"run_number":1,"programmatic_access_type":"OAuth access token"}
    {"action":"workflows.created_workflow_run","actor":"dev","@timestamp":1790900000000,"repo":"example-org/f","workflow_id":27,"workflow_run_id":608,"run_number":1,"name":"CI","head_branch":"main","event":"push","actor_is_bot":false}
    {"action":"workflows.delete_workflow_run","actor":"dev","@timestamp":1790900060000,"repo":"example-org/g","workflow_id":27,"workflow_run_id":609,"run_number":1,"programmatic_access_type":"OAuth access token"}
    {"action":"workflows.created_workflow_run","actor":"dev","@timestamp":1790900000000,"repo":"example-org/h","workflow_id":28,"workflow_run_id":610,"run_number":1,"name":"CI","head_branch":"main","event":"push","actor_is_bot":false}
    {"action":"workflows.delete_workflow_run","actor":"cleanup-app[bot]","@timestamp":1790900600000,"repo":"example-org/h","workflow_id":28,"workflow_run_id":611,"run_number":2,"programmatic_access_type":"GitHub App server-to-server token"}
