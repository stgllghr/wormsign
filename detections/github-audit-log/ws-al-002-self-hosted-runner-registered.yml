title: Self-hosted runner registered by an identity not on the allowlist
id: 4106557b-0a2c-4832-aede-dab20ef0754a
name: ws_al_002_runner_registered_off_allowlist
status: experimental
description: >-
  The worm can register its runner under any name, so any registration outside your
  runner-provisioning identities is reported, at lower severity. Repository-level registrations
  deserve the most attention: the worm registers against a single repository URL. The registration
  event has no runner fields; to get the name, join it to the next *.self_hosted_runner_online event
  for the same repo. Replace the example identity in filter_allowlist with your own before deploying.
  An event without an actor is reported, as Sigma's not filter passes it. The same blind spot as the
  critical rule: a runner registered on a repository in the victim's personal account is in no
  organization audit log. wormsign id WS-AL-002.
references:
  - https://securitylabs.datadoghq.com/articles/shai-hulud-2.0-npm-worm/
  - https://www.wiz.io/blog/shai-hulud-2-0-ongoing-supply-chain-attack
  - https://unit42.paloaltonetworks.com/npm-supply-chain-attack/
  # GitHub audit-log event schema (repo and org runner events and their fields), retrieved 2026-10-14.
  - https://docs.github.com/en/enterprise-cloud@latest/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/audit-log-events-for-your-organization#repo
  # The same for enterprise.register_self_hosted_runner, retrieved 2026-10-14.
  - https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/audit-log-events-for-your-enterprise
author: wormsign
date: 2026-10-14
tags:
  - attack.command-and-control
  - attack.t1102.002
logsource:
  product: github
  service: audit
  definition: >-
    Requirements: GitHub Enterprise Cloud, with the audit log streamed to the SIEM or polled from
    GET /orgs/{org}/audit-log.
detection:
  registration:
    action:
      - repo.register_self_hosted_runner
      - org.register_self_hosted_runner
      - enterprise.register_self_hosted_runner
  filter_allowlist:
    # An example identity: list the ones that provision your runners.
    actor:
      - runner-provisioner[bot]
  condition: registration and not filter_allowlist
falsepositives:
  - Developers registering a personal runner on a repository they administer. Keep an allowlist of runner-provisioning identities.
  - Autoscaling runner fleets register constantly. Their registrations come from a known automation identity, so allowlist that identity rather than the event.
level: medium
examples:
  positive: |
    {"action":"repo.register_self_hosted_runner","actor":"victim-dev","@timestamp":1790900290000,"org":"example-org","repo":"example-org/tooling"}
    {"action":"enterprise.register_self_hosted_runner","actor":"victim-dev","@timestamp":1790900295000,"business":"example-enterprise"}
    {"action":"repo.register_self_hosted_runner","@timestamp":1790900296000,"org":"example-org","repo":"example-org/tooling"}
  negative: |
    {"action":"org.register_self_hosted_runner","actor":"runner-provisioner[bot]","@timestamp":1790900280000,"org":"example-org"}
    {"action":"repo.self_hosted_runner_online","actor":"victim-dev","@timestamp":1790900300000,"org":"example-org","repo":"example-org/tooling","runner_id":42,"runner_name":"build-07"}
