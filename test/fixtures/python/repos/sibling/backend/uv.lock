version = 1
revision = 3
requires-python = ">=3.12"

[[package]]
name = "backend"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "common" },
]

[package.metadata]
requires-dist = [{ name = "common", editable = "../shared/common" }]

[[package]]
name = "common"
version = "0.1.0"
source = { editable = "../shared/common" }
dependencies = [
    { name = "leaf" },
]

[package.metadata]
requires-dist = [{ name = "leaf", directory = "../shared/leaf" }]

[[package]]
name = "leaf"
version = "0.1.0"
source = { directory = "../shared/leaf" }
